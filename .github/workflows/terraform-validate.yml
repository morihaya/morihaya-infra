name: Terraform Validate
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.tflint.hcl'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.tflint.hcl'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/aws/common-r53
          - terraform/aws/root
          - terraform/azure
          - terraform/hcpterraform
          - terraform/homelab
          - terraform/newrelic
          - terraform/pagerduty
          - terraform/spotify
          - terraform/tailscale

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"
