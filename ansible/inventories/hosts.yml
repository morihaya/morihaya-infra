---
# 自宅 Proxmox クラスタ morihaya のインベントリ
#
# 旧 inventories/hosts は ansible-vault で暗号化されていたが、パスワードを
# 紛失して復号不能になったため、実機の状態から作り直した (2026-07-26)。
#
# ホスト名と内部 IP は秘匿する価値が無いので平文で管理する。
# home.morihaya.tech は公開 Route53 ゾーンであり、内部 IP は誰でも dig で
# 引ける。また RFC1918 は経路を持たないため外部から到達もできない。
# 秘密情報が必要になったら group_vars/all/vault.yml を作り、
# vault-pass.sh (1Password 連携) 経由で暗号化すること。詳細は README.md。

all:
  vars:
    ansible_user: root

  children:
    # =========================================================================
    # common ロールの適用対象。play-main.yml はこのグループを見る。
    # =========================================================================
    managed:
      children:
        proxmox: {}
        containers: {}

    # ---- ハイパーバイザ (Debian 13 / PVE 9.1) ----
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.1.2
        pve2:
          ansible_host: 192.168.1.10
        pve3:
          ansible_host: 192.168.1.11

    # ---- LXC コンテナのうち Ansible で管理できるもの ----
    containers:
      hosts:
        dns01:
          ansible_host: 192.168.1.4 # AdGuard Home (DNS + DHCP) / Ubuntu 24.04
        homepage:
          ansible_host: 192.168.1.8 # ダッシュボード / Debian 12
        gh-runner:
          ansible_host: 192.168.1.9 # GitHub Actions ランナー (未セットアップ) / Debian 12

    # =========================================================================
    # まだ管理下に置けないホスト。
    # 下記の手当てを済ませたら containers グループへ移すこと。
    # managed に含まれないので play-main.yml の対象外。
    # =========================================================================
    pending:
      hosts:
        traefik:
          ansible_host: 192.168.1.6
          # Alpine 3.22。python3 が入っておらず Ansible のモジュールが動かない。
          # 有効化するには `apk add python3` が必要。
        pulse:
          ansible_host: 192.168.1.5
          # sshd は稼働しているが root の authorized_keys に鍵が無く
          # Permission denied (publickey) になる。鍵の配置が必要。
        hcp-terraform-agent:
          # VM 103。QEMU guest agent が無効で IP を取得できない。
          # `qm set 103 --agent enabled=1` して agent を導入すれば判明する。
          ansible_host: # 未確定
