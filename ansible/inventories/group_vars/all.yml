---
# =============================================================================
# システム基本設定
#
# 自宅は日本にあるので全ホストを JST に揃える。
#
# ロケールは cloud image 由来のホストで問題になった。Debian の genericcloud
# には C.utf8 しか無く、macOS から SSH すると LC_ALL=en_US.UTF-8 が転送されて
# 解決に失敗する。その結果 vim の encoding が latin1 に落ち、日本語が
# 文字化けする (VM 106 で実際に発生)。
#
#   -bash: warning: setlocale: LC_ALL: cannot change locale (en_US.UTF-8)
#
# =============================================================================
timezone: 'Asia/Tokyo'

locales:
  - 'en_US.UTF-8'
  - 'ja_JP.UTF-8'


users:
  - name: "morihaya"
    # "!!" はパスワードをロックする指定。ログインは SSH 公開鍵のみ。
    password: "!!"
    state: 'present'
    comment: ''
    # 以前は 'wheel' だったが、これは RHEL 系の管理者グループ名。
    # 現在の対象は全て Debian / Ubuntu なので存在せず、user モジュールが
    # 失敗していた。Debian 系の sudo グループに修正する。
    groups: 'sudo'
    key: "keys/authorized_keys.morihaya"


bashrc_block: |
  alias ll='ls -l'
  alias lt='ls -lt'
  alias ltr='ls -ltr'
  alias g='git'
  alias gcv='git commit -v'
  alias gdc='git diff --cached'
  alias gdi='git diff'
  alias gf='git fetch --prune'
  alias gp='git plog -10'
  alias gr='git fetch --prune && git checkout origin/master && git plog -10 && git status'
  alias gs='git switch -d origin/master'
  alias gst='git status'
  alias t='terraform'
  alias k='kubectl'
  alias kg='kubectl get'
  alias kd='kubectl describe'
  alias kx='kubectx'
  alias kn='kubens'
  alias d='docker'
