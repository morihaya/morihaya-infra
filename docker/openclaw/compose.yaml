# OpenClaw 執事エージェント (VM 106 / 192.168.1.12)
#
# 秘密情報は .env に置く (git 管理外)。.env.example を参照。
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped

    # AWS のアクセスキーと Slack のトークンはここから読む
    env_file: .env

    environment:
      # Bedrock は東京リージョン固定。モデルは openclaw.json 側で指定する。
      AWS_REGION: ap-northeast-1

      # コンテナのタイムゾーン。ホスト (VM 106) の設定は引き継がれないため
      # ここで明示する。定時通知や cron はコンテナ内の時刻で動くので、
      # UTC のままだと朝のブリーフィングが 9 時間ずれる。
      TZ: Asia/Tokyo

    volumes:
      # 設定・認証情報・会話履歴・workspace が全てこの下に載る。
      # コンテナは uid 1000 (node) で動き、VM 側の morihaya も uid 1000 なので
      # ホスト側のファイル所有者はそのままで良い。
      - ./data/config:/home/node/.openclaw
      # 認証プロファイルの秘密ディレクトリは別系統
      - ./data/secrets:/home/node/.config/openclaw

    ports:
      # Control UI。LAN へは晒さず 127.0.0.1 に閉じる。
      # 手元から見たい場合は SSH ポートフォワードを使う (README 参照)。
      - "127.0.0.1:18789:18789"

    # エージェントがシェルを実行できる以上、コンテナ側でも素直に絞っておく
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Google カレンダーを読ませるための MCP サーバ。
  # openclaw と同じ compose プロジェクトなので同一ネットワークに載り、
  # サービス名 google-calendar-mcp がそのまま DNS 名になる。
  google-calendar-mcp:
    build: ./google-calendar-mcp
    container_name: google-calendar-mcp
    restart: unless-stopped

    environment:
      TRANSPORT: http

      # コンテナ内 127.0.0.1 に閉じると openclaw コンテナから届かない。
      # ports を publish しないので、到達できるのは compose の内部ネットワークだけ。
      # (上流が「HTTP モードは認証層が無いので信頼できない NW に晒すな」と
      #  書いているのは、この閉じ方で満たしている)
      HOST: 0.0.0.0
      PORT: "3000"
      TZ: Asia/Tokyo

      # OAuth クライアントの JSON。秘密情報なので VM 上に手で置く (README 参照)。
      GOOGLE_OAUTH_CREDENTIALS: /run/secrets/gcp-oauth.keys.json

      # 取得したトークンの保存先。ディレクトリではなくファイルパスを指定する。
      GOOGLE_CALENDAR_MCP_TOKEN_PATH: /data/tokens.json

      # 読み取りツールだけを登録する。書き込み系 (create-event / update-event /
      # delete-event / respond-to-event) はそもそも公開されなくなる。
      #
      # NOTE: このサーバは OAuth スコープを .../auth/calendar (読み書き) に
      # ハードコードしており readonly スコープを選べない。本当の読み取り専用は
      # 「執事用 Google アカウントへ閲覧権限だけで共有する」という Google 側の
      # ACL で担保している。ここと openclaw.json の toolFilter はその二重の網。
      ENABLED_TOOLS: "list-calendars,list-events,search-events,get-event,get-freebusy,get-current-time,list-colors"

    volumes:
      - ./gcp-oauth.keys.json:/run/secrets/gcp-oauth.keys.json:ro
      - ./data/gcal:/data

    # VM 106 は 4GB しかなく openclaw と同居するので絞っておく
    deploy:
      resources:
        limits:
          memory: 256M

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
